[project]
name = "veridian-student"
version = "0.1.0"
description = "AI education system backend"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.79.0",
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    "openai>=1.0.0",
    "pillow>=10.0.0",
    "python-dotenv>=1.0.0",
    "supabase>=2.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]
