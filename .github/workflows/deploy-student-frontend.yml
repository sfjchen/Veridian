name: Deploy Student Frontend

on:
  push:
    branches: [main]
    paths:
      - "student/frontend/**"
      - ".github/workflows/deploy-student-frontend.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: student/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: student/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Expo web
        run: npx expo export -p web

      - name: Deploy to Vercel
        run: npx vercel deploy --prod --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
