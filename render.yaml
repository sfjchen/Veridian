# Render Blueprint — whiteboard slice (student Flask backend only).
# Connect repo at https://dashboard.render.com/blueprints → New Blueprint Instance.
# Set secret env vars in the Render dashboard after first deploy.

services:
  - type: web
    name: veridian-student-backend
    runtime: python
    region: oregon
    plan: starter
    rootDir: student/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 --timeout 120 -b 0.0.0.0:$PORT get_coords:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-4-5-20250929
      - key: SUPABASE_URL
        value: https://tpqasmpieyteutvdntda.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://veridian-student.vercel.app,https://s.veridian.fyi
      - key: WS_CORS_ORIGINS
        value: https://veridian-student.vercel.app,https://s.veridian.fyi
