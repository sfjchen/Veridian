name: Deploy Student Frontend

on:
  push:
    branches: [main]
    paths:
      - "student/frontend/**"
      - "render.yaml"
      - ".github/workflows/deploy-student-frontend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-student-frontend-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://tpqasmpieyteutvdntda.supabase.co' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Validate deploy configuration
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID EXPO_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret: $name"
              missing=1
            fi
          done
          if [ -z "$EXPO_PUBLIC_BACKEND_URL" ]; then
            echo "::error::Missing repository variable EXPO_PUBLIC_BACKEND_URL"
            missing=1
          fi
          exit "$missing"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          EXPO_PUBLIC_BACKEND_URL: ${{ vars.EXPO_PUBLIC_BACKEND_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Deploy to Vercel (remote build with CI env)
        run: |
          npx vercel@54.9.1 deploy --prod --yes --token "$VERCEL_TOKEN" \
            --build-env "EXPO_PUBLIC_BACKEND_URL=$EXPO_PUBLIC_BACKEND_URL" \
            --build-env "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL" \
            --build-env "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          EXPO_PUBLIC_BACKEND_URL: ${{ vars.EXPO_PUBLIC_BACKEND_URL }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://tpqasmpieyteutvdntda.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Smoke check production bundle
        run: ./scripts/smoke-whiteboard.sh --url https://veridian-student.vercel.app
