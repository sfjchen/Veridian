# Render Blueprint — whiteboard slice (student Flask backend only).
# Connect repo at https://dashboard.render.com/blueprints → New Blueprint Instance.
# Set secret env vars in the Render dashboard after first deploy.
# Reference only: the live service veridian-student-backend-free (free plan) was created from this spec through the
# Render API on 2026-11-11 and is not Blueprint-managed. Blueprint auto-sync is off. Change its env vars in the dashboard.

services:
  - type: web
    name: veridian-student-backend-free
    runtime: python
    region: oregon
    plan: free
    rootDir: student/backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class gthread --threads 8 --timeout 120 -w 1 -b 0.0.0.0:$PORT get_coords:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: MISTAKE_ANALYSIS_BACKEND
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MISTAKE_ANALYSIS_OPENROUTER_MODEL
        value: anthropic/claude-sonnet-5.5
      - key: MISTAKE_COORD_OPENROUTER_MODEL
        value: anthropic/claude-sonnet-5.5
      - key: MISTAKE_ANALYSIS_MODEL
        value: anthropic/claude-sonnet-5.5
      - key: MISTAKE_ANALYSIS_THINKING
        value: "0"
      - key: CHAT_BACKEND
        value: openrouter
      - key: CHAT_OPENROUTER_MODEL
        value: anthropic/claude-sonnet-5.5
      - key: MATH_OCR_BACKEND
        value: openrouter
      - key: MATH_OCR_OPENROUTER_MODEL
        value: google/gemini-2.0-flash-001
      - key: LLM_BACKEND
        value: openrouter
      - key: OPENAI_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        value: claude-sonnet-5-5
      - key: SUPABASE_URL
        value: https://tpqasmpieyteutvdntda.supabase.co
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://veridian-student.vercel.app,https://www.veridian.fyi
      - key: WS_CORS_ORIGINS
        value: https://veridian-student.vercel.app,https://www.veridian.fyi
