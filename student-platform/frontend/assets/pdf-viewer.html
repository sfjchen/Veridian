<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #fff; }
    #canvasContainer { width: 100%; height: 100%; overflow: auto; -webkit-overflow-scrolling: touch; }
    canvas { display: block; margin: 0 auto; }
  </style>
</head>
<body>
  <div id="canvasContainer"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    var pdfDoc = null;
    function base64ToUint8Array(base64) {
      var raw = atob(base64);
      var arr = new Uint8Array(raw.length);
      for (var i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
      return arr;
    }
    window.loadPdfPage = function(base64, pageNum) {
      var container = document.getElementById('canvasContainer');
      container.innerHTML = '';
      var data = base64ToUint8Array(base64);
      pdfjsLib.getDocument({ data: data }).promise.then(function(pdf) {
        pdfDoc = pdf;
        if (window.ReactNativeWebView) {
          window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'totalPages', totalPages: pdf.numPages }));
        }
        return pdf.getPage(pageNum);
      }).then(function(page) {
        var scale = 2;
        var viewport = page.getViewport({ scale: scale });
        var canvas = document.createElement('canvas');
        var ctx = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        container.appendChild(canvas);
        return page.render({ canvasContext: ctx, viewport: viewport }).promise;
      }).catch(function(err) {
        if (window.ReactNativeWebView) {
          window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'error', message: String(err && err.message) }));
        }
      });
    };
  </script>
</body>
</html>
